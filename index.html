<h1>Poem</h1>

<h2>By: Michelle Kagan </h2>

<p> I wake up every morning <br>
For the same reason every time <br> 
Be it for school <br>
Be it for music <br> 
I still wake up <br>
Whether it is for working <br> 
Whether it is for a meeting <br> 
I wake up <br> </p>

<p> I wake up for anything <br> 
For food, for water <br> 
To study, to read <br> 
Going out, going in <br> 
I still wake up</p>
